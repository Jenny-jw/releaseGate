# 演示用虛構資料：曲目、專輯、ISRC、發行日皆為虛構。
# Pomme、Ed Sheeran 是真實歌手，但這裡列出的歌曲與專輯都不是他們的作品，與歌手本人及其唱片公司無關。
# Hsia Tang、Amu Trio 是虛構的演奏者；德布西的作品已屬公共領域，錄音是虛構的。
#
# is_public 是唯一的判斷依據；release_date 只用來顯示，以及檢查資料是否過期。
# ISRC 以不含連字號的 12 碼存放，例如 FRRG02600101 寫成 FR-RG0-26-00101 也是同一首。
# ISRC 的國碼依錄音來源（FR 法國、GB 英國、TW 台灣），登記者代碼 RG0 是虛構的。
# lyrics 只有未公開的演唱曲目才有；純音樂與古典樂沒有歌詞。

