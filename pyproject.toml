[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-gate"
version = "0.1.0"
description = "Corporate AI pilot: scores CLI and IDE assistants, blocks unreleased catalog data, and answers license questions with citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "chromadb>=0.5",
    "httpx>=0.27",
    "openai>=1.40",
    "PyYAML>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
release-gate-eval = "eval.cli:app"

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
